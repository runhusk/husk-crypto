[package]
name = "husk-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Husk browser crypto core — Argon2id + ChaCha20-Poly1305 envelopes for the vault, encrypted profiles, and per-note seals."
repository = "https://github.com/runhusk/husk-crypto"
readme = "README.md"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
url = "2"
